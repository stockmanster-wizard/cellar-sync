name: CI & Cloud Run Auto-Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Prepare Firebase Applet Config
      env:
        FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
      run: |
        if [ -n "$FIREBASE_APPLET_CONFIG" ]; then
          printf '%s\n' "$FIREBASE_APPLET_CONFIG" > firebase-applet-config.json
        elif [ ! -f firebase-applet-config.json ]; then
          cp firebase-applet-config.example.json firebase-applet-config.json
        fi

    - name: Run TypeScript Type Check
      run: npm run lint

    - name: Run Pre-Launch Multi-User Audit Suite
      run: npm test

    - name: Build Production Bundle
      run: npm run build

    - name: Authenticate to Google Cloud
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.GCP_SA_KEY != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Deploy to Google Cloud Run
      if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.GCP_SA_KEY != ''
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ vars.CLOUD_RUN_SERVICE || 'cellarsync-ai' }}
        region: ${{ vars.CLOUD_RUN_REGION || 'us-east1' }}
        source: .
        flags: '--allow-unauthenticated'
        env_vars: |
          NODE_ENV=production
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY=${{ secrets.SERPER_API_KEY }}
